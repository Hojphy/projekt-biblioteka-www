<!DOCTYPE html>

<html lang="pl">

<!-- ========== Head ========== -->

<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lekturoteka</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/konto.css">
    <script defer src="../js/script.js"></script>
    <script defer src="../js/konto.js"></script>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>

    <!-- === Skrypt ustawiający odpowiedni motyw przy starcie strony === -->
    
    <script>
        const theme = localStorage.getItem("theme") || "light";
        if (theme == "dark") {document.documentElement.classList.add("dark");} 
        else {document.documentElement.classList.add("light");}
    </script>
</head>

<!-- ========== Body ========== -->

<body>
    <!-- === Sticky na górze === -->

    <komponent-naglowek></komponent-naglowek>

    <!-- === Menu otwierane po lewej === -->

    <komponent-nawigacja></komponent-nawigacja>

    <!-- === Konto === -->

    <main id="main">
        <div id="konto">
            <div id="widok-niezalogowany">
                <div class="formularz-karta">
                    <h2>Zaloguj się</h2>
                    <input type="text" placeholder="Login lub email" id="login-input">
                    <input type="password" placeholder="Hasło" id="haslo-input">
                    <button id="zaloguj-btn" class="przycisk">Zaloguj</button>
                </div>

                <div class="formularz-karta">
                    <h2>Zarejestruj się</h2>
                    <input type="text" placeholder="Login" id="rej-login-input">
                    <input type="password" placeholder="Hasło" id="rej-haslo-input">
                    <button id="zarejestruj-btn" class="przycisk">Zarejestruj</button>
                </div>
            </div>

            <div id="widok-zalogowany" class="ukryty">
                <div class="konto-info">
                    <h3>Konto</h3>
                    <p id="konto-info-login"><strong>Twój login:</strong> login</p>
                </div>

                <div class="wypozyczenia">
                    <h3>Twoje wypożyczenia</h3>
                    <div id="konto-wypozyczone" class="ksiazki_grid">
                        <p>Brak wypożyczonych książek.</p>
                    </div>
                </div>

                <div class="opcje-konto">
                    <h3>Opcje konta</h3>
                    <button id="wyloguj-btn" class="czerwony-przycisk">Wyloguj się</button>
                    <button id="usun-konto-btn" class="czerwony-przycisk">Usuń konto</button>
                </div>
            </div>
        </div>
    </main>

    <komponent-powiadomienia></komponent-powiadomienia>
</body>
</html>
